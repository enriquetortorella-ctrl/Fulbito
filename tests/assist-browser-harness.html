<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Assist flow harness</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/jugadores.css">
  <link rel="stylesheet" href="../css/equipos.css">
  <link rel="stylesheet" href="../css/goles.css">
  <link rel="stylesheet" href="../css/utils.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/theme-aurora.css">
  <style>
    body{padding:20px;background:#07101a;color:#eef5ff}
    #harness-result{position:fixed;top:8px;right:8px;z-index:500;padding:8px 12px;border-radius:8px;background:#102238;font:12px sans-serif}
  </style>
</head>
<body>
  <div id="harness-result">READY</div>
  <main id="goles-content"></main>
  <div class="modal-overlay goal-assist-overlay" id="modal-goal-assist" onclick="if(event.target===this) cancelGoalAssist()" onkeydown="handleGoalAssistKeydown(event)">
    <div class="modal goal-assist-modal" role="dialog" aria-modal="true" aria-labelledby="goal-assist-title">
      <button class="modal-close" onclick="cancelGoalAssist()" aria-label="Cancelar carga del gol">✕</button>
      <div id="modal-goal-assist-content"></div>
    </div>
  </div>
  <div id="toast"></div>
  <script>
    const TEAM_NAMES = ['A','B','C'];
    const TEAM_EMOJIS = ['🔵','🔴','🟣'];
    const TEAM_CLASSES = ['team-a','team-b','team-c'];
    const state = {currentClub:{id:'club-test',name:'Club Test'},currentUser:{id:'p-scorer',name:'Enrique',isAdmin:false}};
    let matches = [{
      id:'m-assist-test',match_date:'2026-09-05',
      teams:[
        {name:'A',players:[{id:'p-scorer',name:'Enrique Tortorella'},{id:'p-mate-1',name:'Tula Leandro'},{id:'guest_1',name:'Invitado Largo de Prueba',isGuest:true}]},
        {name:'B',players:[{id:'p-rival',name:'Jugador Rival'}]}
      ],
      result:{winner:null,margin:null,mvp:null,goals:{},goalEvents:[],goalsTracked:true,assistsTracked:true}
    }];
    function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function openModal(id){document.getElementById(id).classList.add('open');}
    function closeModal(id){document.getElementById(id).classList.remove('open');}
    function showToast(message){document.getElementById('harness-result').textContent=message;}
    function switchTab(){}
    function renderHub(){}
    function renderPlayers(){}
    function getGoals(m){return m?.result?.goals||{};}
    function getGoalEvents(m){return Array.isArray(m?.result?.goalEvents)?m.result.goalEvents:[];}
    function isPlayed(m){return m?.result?.winner!==null&&m?.result?.winner!==undefined;}
    function teamGoals(m,index){const goals=getGoals(m);return (m.teams[index].players||[]).reduce((n,p)=>n+(goals[p.id]||0),goals['__t'+index]||0);}
    function matchHasGoals(m){return Object.values(getGoals(m)).some(Number);}
    function matchScoreStr(m){return m.teams.map((_,i)=>teamGoals(m,i)).join('–');}
    function formatMatchDate(){return '05/09/2026';}
    function matchPlayerName(m,id){for(const team of m.teams){const player=team.players.find(item=>item.id===id);if(player)return player.name;}return '¿?';}
    function playerNameById(id){return matchPlayerName(matches[0],id);}
    function matchAssisters(m){const totals={};getGoalEvents(m).forEach(event=>{if(event.assistType==='player'&&event.assistPlayerId)totals[event.assistPlayerId]=(totals[event.assistPlayerId]||0)+1;});return Object.entries(totals).map(([id,assists])=>({id,name:matchPlayerName(m,id),assists}));}
    function matchScorers(m){return Object.entries(getGoals(m)).filter(([id,n])=>!id.startsWith('__t')&&n>0).map(([id,goals])=>({id,name:matchPlayerName(m,id),goals}));}
    function marginLabel(){return '';}
    let serverMatches = structured(matches);
    async function loadMatches(){return structured(serverMatches);}
    async function upsertMatch(){return true;}
    async function confirmAppAction(){return false;}
    function structured(value){return JSON.parse(JSON.stringify(value));}
    let simulatedLostResponse = false;
    async function callRpc(name,args){
      if(name==='fulbito_record_goal_event'&&new URLSearchParams(location.search).has('fail'))throw new Error('Falla simulada de red');
      const match=serverMatches.find(item=>item.id===(args.p_match_id||'m-assist-test'));
      if(name==='fulbito_record_goal_event'){
        if((match.result.goalEventMutationIds||[]).includes(args.p_event_id))return {id:match.id,result:structured(match.result)};
        match.result.goalEventMutationIds=[...(match.result.goalEventMutationIds||[]),args.p_event_id];
        if(args.p_delta===1){
          match.result.goalEvents.push({id:args.p_event_id,scorerId:args.p_scorer_id,assistType:args.p_assist_type,assistPlayerId:args.p_assist_player_id});
          match.result.goals[args.p_scorer_id]=(match.result.goals[args.p_scorer_id]||0)+1;
        }else{
          for(let i=match.result.goalEvents.length-1;i>=0;i--){if(match.result.goalEvents[i].scorerId===args.p_scorer_id){match.result.goalEvents.splice(i,1);break;}}
          match.result.goals[args.p_scorer_id]=Math.max(0,(match.result.goals[args.p_scorer_id]||0)-1);
          if(!match.result.goals[args.p_scorer_id])delete match.result.goals[args.p_scorer_id];
        }
        const query = new URLSearchParams(location.search);
        const loseThisResponse = query.has('lost') || (query.has('lostminus') && args.p_delta === -1);
        if(loseThisResponse&&!simulatedLostResponse){simulatedLostResponse=true;throw new Error('Respuesta simulada perdida');}
        return {id:match.id,result:structured(match.result)};
      }
      if(name==='fulbito_record_goal'){
        const key=args.p_goal_key;
        const next=Math.max(0,(match.result.goals[key]||0)+args.p_delta);
        if(next)match.result.goals[key]=next;else delete match.result.goals[key];
        return {id:match.id,result:structured(match.result)};
      }
      return {id:match.id,result:structured(match.result)};
    }
  </script>
  <script src="../js/stats-core.js"></script>
  <script src="../js/tabs/goles.js"></script>
  <script src="../js/sync.js"></script>
  <script src="goal-scoreboard-layout.js"></script>
  <script>
    if(new URLSearchParams(location.search).has('admin'))state.currentUser.isAdmin=true;
    if(new URLSearchParams(location.search).has('closed'))matches[0].result.winner=0;
    renderGoles();
    if(new URLSearchParams(location.search).has('auto'))openGoalAssistPicker('m-assist-test','p-scorer');
    if(new URLSearchParams(location.search).has('closed')){
      window.__CLOSED_CHECKS__={locked:document.querySelectorAll('.goal-locked').length,editButtons:document.querySelectorAll('.goal-btn').length};
      document.getElementById('harness-result').textContent=window.__CLOSED_CHECKS__.locked>0&&window.__CLOSED_CHECKS__.editButtons===0?'PASS CLOSED':'FAIL CLOSED';
    }
    if(new URLSearchParams(location.search).has('statchecks')){
      const sample = result => ({result,teams:[{players:[{id:'p1'},{id:'p2'}]}]});
      window.__STATS_CHECKS__={
        empty_new_match:hasAssistsTracking(sample({goals:{},goalEvents:[],goalsTracked:true,assistsTracked:true})),
        complete_match:hasAssistsTracking(sample({goals:{p1:1},goalEvents:[{id:'e1',scorerId:'p1',assistType:'individual',assistPlayerId:null}],goalsTracked:true,assistsTracked:true})),
        historical_mixed:hasAssistsTracking(sample({goals:{p1:2},goalEvents:[{id:'e1',scorerId:'p1',assistType:'individual',assistPlayerId:null}],goalsTracked:true,assistsTracked:true})),
        legacy_unknown:hasAssistsTracking(sample({goals:{p1:1},goalEvents:[{id:'e1',scorerId:'p1',assistType:'unrecorded',assistPlayerId:null}],goalsTracked:true,assistsTracked:true})),
        wrong_scorer:hasAssistsTracking(sample({goals:{p1:1},goalEvents:[{id:'e1',scorerId:'p2',assistType:'individual',assistPlayerId:null}],goalsTracked:true,assistsTracked:true})),
        duplicate_event:hasAssistsTracking(sample({goals:{p1:2},goalEvents:[{id:'e1',scorerId:'p1',assistType:'individual',assistPlayerId:null},{id:'e1',scorerId:'p1',assistType:'rebound',assistPlayerId:null}],goalsTracked:true,assistsTracked:true})),
        self_assist:hasAssistsTracking(sample({goals:{p1:1},goalEvents:[{id:'e1',scorerId:'p1',assistType:'player',assistPlayerId:'p1'}],goalsTracked:true,assistsTracked:true})),
        cross_team_assist:hasAssistsTracking({result:{goals:{p1:1},goalEvents:[{id:'e1',scorerId:'p1',assistType:'player',assistPlayerId:'p2'}],goalsTracked:true,assistsTracked:true},teams:[{players:[{id:'p1'}]},{players:[{id:'p2'}]}]}),
        duplicate_assister:hasAssistsTracking({result:{goals:{p1:1},goalEvents:[{id:'e1',scorerId:'p1',assistType:'player',assistPlayerId:'p2'}],goalsTracked:true,assistsTracked:true},teams:[{players:[{id:'p1'},{id:'p2'}]},{players:[{id:'p2'}]}]}),
        unattributed_goal:hasAssistsTracking(sample({goals:{__t0:1},goalEvents:[],goalsTracked:true,assistsTracked:true})),
        malicious_goal_filtered:matchTotalGoals(sample({goals:{p1:'<img src=x onerror=alert(1)>',p2:3},goalsTracked:true}))===3,
        numeric_string_normalized:matchTotalGoals(sample({goals:{p1:'2',p2:3},goalsTracked:true}))===5
      };
      document.getElementById('harness-result').textContent = JSON.stringify(window.__STATS_CHECKS__);
    }
    if(new URLSearchParams(location.search).has('resetchecks')){
      (async()=>{
        const checks={};
        let confirmations=[];
        let upserts=0;
        confirmAppAction=async options=>{confirmations.push(options);return true;};
        upsertMatch=async match=>{upserts++;return true;};
        state.currentUser.isAdmin=true;

        matches[0].result={winner:0,winners:[0],margin:2,mvp:'p-scorer',goals:{'p-scorer':2},goalEvents:[{id:'e1',scorerId:'p-scorer',assistType:'individual',assistPlayerId:null},{id:'e2',scorerId:'p-scorer',assistType:'rebound',assistPlayerId:null}],goalsTracked:true,assistsTracked:true};
        renderGoles();
        checks.trackedResetButton=[...document.querySelectorAll('button')].some(button=>button.textContent.includes('Reiniciar planilla'));
        await resetGoals(matches[0].id);
        checks.closedBecomesDraw=matches[0].result.winner==='draw'&&matches[0].result.margin===null&&JSON.stringify(matches[0].result.winners)==='[0,1]';
        checks.closedBecomesZero=matchScoreStr(matches[0])==='0–0'&&Object.keys(matches[0].result.goals).length===0&&matches[0].result.goalEvents.length===0;
        checks.confirmExplainsOutcome=/empate 0–0/i.test(confirmations[0]?.message||'')&&/0–0/.test(confirmations[0]?.confirmText||'');
        checks.oneTrackedUpsert=upserts===1;

        confirmations=[];
        const beforeUpserts=upserts;
        matches[0].result={winner:0,winners:[0],margin:1,mvp:null,goals:{},goalEvents:[],goalsTracked:false,assistsTracked:false};
        renderGoles();
        checks.noMarkerHasNoReset=[...document.querySelectorAll('button')].every(button=>!button.textContent.includes('Reiniciar'));
        checks.noMarkerExplicitState=/PARTIDO CERRADO SIN MARCADOR/.test(document.getElementById('goles-content').textContent);
        checks.noMarkerHasNoScoreboard=!document.querySelector('.score-board')&&!document.querySelector('.goal-btn');
        checks.noMarkerHasCreateAction=[...document.querySelectorAll('button')].some(button=>button.textContent.includes('Crear planilla y reabrir'));
        state.currentUser.isAdmin=false;
        renderGoles();
        checks.noMarkerPlayerCannotCreate=[...document.querySelectorAll('button')].every(button=>!button.textContent.includes('Crear planilla'));
        state.currentUser.isAdmin=true;
        await resetGoals(matches[0].id);
        checks.noMarkerDirectCallBlocked=confirmations.length===0&&upserts===beforeUpserts&&matches[0].result.winner===0&&matches[0].result.goalsTracked===false;
        await startGoalSheetForClosedMatch(matches[0].id);
        checks.createSheetExplainsReopen=/volverá a quedar abierto/i.test(confirmations[0]?.message||'')&&/ganador actual se quitará/i.test(confirmations[0]?.message||'');
        checks.createSheetReopens=matches[0].result.winner===null&&matches[0].result.margin===null&&matches[0].result.goalsTracked===true&&matches[0].result.assistsTracked===true;
        checks.createSheetShowsBoard=!!document.querySelector('.score-board')&&document.querySelectorAll('.goal-btn').length>0;
        checks.createSheetOneUpsert=upserts===beforeUpserts+1;

        window.__RESET_CHECKS__=checks;
        document.getElementById('harness-result').dataset.checks=JSON.stringify(checks);
        const failed=Object.entries(checks).filter(([,ok])=>!ok).map(([name])=>name);
        document.getElementById('harness-result').textContent=failed.length?`FAIL RESET: ${failed.join(', ')}`:'PASS RESET';
      })().catch(error=>{document.getElementById('harness-result').textContent=`FAIL RESET: ${error.message}`;});
    }
    if(new URLSearchParams(location.search).has('refreshchecks')){
      (async()=>{
        const checks={};
        matches=Array.from({length:15},(_,index)=>({
          id:`m-${String(index+1).padStart(2,'0')}`,
          match_date:`2026-08-${String(index+1).padStart(2,'0')}`,
          created_at:`2026-08-${String(index+1).padStart(2,'0')}T20:00:00Z`,
          teams:structured(serverMatches[0].teams),
          result:{winner:null,margin:null,mvp:null,goals:{},goalEvents:[],goalsTracked:true,assistsTracked:true}
        }));
        renderGoles();
        const optionValues=[...document.querySelectorAll('.goles-select option')].map(option=>option.value);
        checks.selectorShowsAll=optionValues.length===15;
        checks.selectorNewestFirst=optionValues[0]==='m-15'&&optionValues.at(-1)==='m-01';

        let lastToast='';
        showToast=message=>{lastToast=message;};
        const cachedIds=matches.map(match=>match.id).join(',');
        loadMatches=async()=>null;
        await refreshGoles();
        checks.failedReadKeepsCache=matches.map(match=>match.id).join(',')===cachedIds;
        checks.failedReadNoSuccess=!/Planilla actualizada/.test(lastToast)&&/No se pudo actualizar/.test(lastToast);

        loadMatches=async()=>[];
        await refreshGoles();
        checks.emptySuccessClears=matches.length===0&&/Planilla actualizada/.test(lastToast);

        window.__REFRESH_CHECKS__=checks;
        document.getElementById('harness-result').dataset.checks=JSON.stringify(checks);
        const failed=Object.entries(checks).filter(([,ok])=>!ok).map(([name])=>name);
        document.getElementById('harness-result').textContent=failed.length?`FAIL REFRESH: ${failed.join(', ')}`:'PASS REFRESH';
      })().catch(error=>{document.getElementById('harness-result').textContent=`FAIL REFRESH: ${error.message}`;});
    }
  </script>
</body>
</html>
