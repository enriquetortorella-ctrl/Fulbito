plugins {
    id 'com.android.application'
}

def releasePropertiesFile = rootProject.file('keystore.properties')
def releaseProperties = new Properties()
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    .every { releaseProperties.getProperty(it) }

android {
    namespace 'ar.com.fulbito.app'
    compileSdk 34

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }

    defaultConfig {
        applicationId 'ar.com.fulbito.app'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('ANDROID_VERSION_CODE') ?: '1').toInteger()
        versionName (System.getenv('ANDROID_VERSION_NAME') ?: '1.0.0')
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else if (System.getenv('GITHUB_ACTIONS') == 'true') {
                // La CI verifica el empaquetado release con la firma debug
                // descartable. La publicación final exige la firma privada.
                signingConfig signingConfigs.debug
            }
        }
    }
}
